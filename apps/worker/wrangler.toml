# Croco Games API Worker.
# Secrets are NEVER stored here. Set them with `wrangler secret put <NAME> --env <env>`:
#   MFA_ENCRYPTION_KEY, RECOVERY_CODE_PEPPER, IP_HASH_KEY, ADMIN_FIREBASE_UID,
#   ADMIN_BOOTSTRAP_EMAIL, TURNSTILE_SECRET (optional)
name = "croco-games-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true
upload_source_maps = false

[vars]
ENVIRONMENT = "development"
FIREBASE_PROJECT_ID = "croco-games-dev"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"
FIREBASE_AUTH_DOMAIN = "croco-games-dev.firebaseapp.com"

[[d1_databases]]
binding = "DB"
database_name = "croco-games-dev"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../database/migrations"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "LobbyDO"

# One chat room per game type (Joker, Bura, …).
[[durable_objects.bindings]]
name = "GAME_CHAT"
class_name = "GameChatDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO", "LobbyDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["GameChatDO"]

# Workers Rate Limiting bindings (period must be 10 or 60 seconds).
[[ratelimits]]
name = "RL_AUTH"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_WRITE"
namespace_id = "1002"
simple = { limit = 40, period = 60 }

[[ratelimits]]
name = "RL_READ"
namespace_id = "1003"
simple = { limit = 180, period = 60 }

[[ratelimits]]
name = "RL_TICKET"
namespace_id = "1004"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_IP"
namespace_id = "1005"
simple = { limit = 900, period = 60 }

# ---------------------------------------------------------------------------
# Staging: dedicated D1 + origins. Used for authorized security testing.
[env.staging]
name = "croco-games-api-staging"
workers_dev = true
vars = { ENVIRONMENT = "staging", FIREBASE_PROJECT_ID = "REPLACE_WITH_STAGING_PROJECT_ID", FIREBASE_AUTH_DOMAIN = "REPLACE.firebaseapp.com", ALLOWED_ORIGINS = "https://staging.example.com" }
d1_databases = [{ binding = "DB", database_name = "croco-games-staging", database_id = "REPLACE_WITH_STAGING_D1_ID", migrations_dir = "../../database/migrations" }]
durable_objects.bindings = [{ name = "ROOM", class_name = "RoomDO" }, { name = "LOBBY", class_name = "LobbyDO" }, { name = "GAME_CHAT", class_name = "GameChatDO" }]
ratelimits = [
  { name = "RL_AUTH", namespace_id = "2001", simple = { limit = 10, period = 60 } },
  { name = "RL_WRITE", namespace_id = "2002", simple = { limit = 40, period = 60 } },
  { name = "RL_READ", namespace_id = "2003", simple = { limit = 180, period = 60 } },
  { name = "RL_TICKET", namespace_id = "2004", simple = { limit = 20, period = 60 } },
  { name = "RL_IP", namespace_id = "2005", simple = { limit = 900, period = 60 } },
]

# Demo: isolated backend for the GitHub Pages demo. Separate D1, no production data,
# admin features are disabled unless explicitly configured with demo-only secrets.
[env.demo]
name = "croco-games-api-demo"
workers_dev = true
vars = { ENVIRONMENT = "demo", FIREBASE_PROJECT_ID = "REPLACE_WITH_DEMO_PROJECT_ID", FIREBASE_AUTH_DOMAIN = "REPLACE.firebaseapp.com", ALLOWED_ORIGINS = "https://gtsulaia09.github.io" }
d1_databases = [{ binding = "DB", database_name = "croco-games-demo", database_id = "REPLACE_WITH_DEMO_D1_ID", migrations_dir = "../../database/migrations" }]
durable_objects.bindings = [{ name = "ROOM", class_name = "RoomDO" }, { name = "LOBBY", class_name = "LobbyDO" }, { name = "GAME_CHAT", class_name = "GameChatDO" }]
ratelimits = [
  { name = "RL_AUTH", namespace_id = "3001", simple = { limit = 10, period = 60 } },
  { name = "RL_WRITE", namespace_id = "3002", simple = { limit = 40, period = 60 } },
  { name = "RL_READ", namespace_id = "3003", simple = { limit = 180, period = 60 } },
  { name = "RL_TICKET", namespace_id = "3004", simple = { limit = 20, period = 60 } },
  { name = "RL_IP", namespace_id = "3005", simple = { limit = 900, period = 60 } },
]

# Production: only the production Pages origin. Never the GitHub Pages demo origin.
[env.production]
name = "croco-games-api"
workers_dev = false
vars = { ENVIRONMENT = "production", FIREBASE_PROJECT_ID = "REPLACE_WITH_PROD_PROJECT_ID", FIREBASE_AUTH_DOMAIN = "REPLACE.firebaseapp.com", ALLOWED_ORIGINS = "https://REPLACE_WITH_PRODUCTION_PAGES_DOMAIN" }
d1_databases = [{ binding = "DB", database_name = "croco-games-prod", database_id = "REPLACE_WITH_PROD_D1_ID", migrations_dir = "../../database/migrations" }]
durable_objects.bindings = [{ name = "ROOM", class_name = "RoomDO" }, { name = "LOBBY", class_name = "LobbyDO" }, { name = "GAME_CHAT", class_name = "GameChatDO" }]
ratelimits = [
  { name = "RL_AUTH", namespace_id = "4001", simple = { limit = 10, period = 60 } },
  { name = "RL_WRITE", namespace_id = "4002", simple = { limit = 40, period = 60 } },
  { name = "RL_READ", namespace_id = "4003", simple = { limit = 180, period = 60 } },
  { name = "RL_TICKET", namespace_id = "4004", simple = { limit = 20, period = 60 } },
  { name = "RL_IP", namespace_id = "4005", simple = { limit = 900, period = 60 } },
]
