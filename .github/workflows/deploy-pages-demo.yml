name: Deploy GitHub Pages Demo

# Deploys the isolated demo frontend to GitHub Pages.
# SECURITY INVARIANT: This workflow NEVER accesses production secrets, production origins,
# production databases, or production admin endpoints. When DEMO_API_BASE is unset, the app
# runs in clearly labelled local practice-vs-bots mode with zero external requests.
#
# Manual only: the live site is on Cloudflare (deploy-production.yml). To use this demo, enable
# GitHub Pages (Settings → Pages → Source: GitHub Actions), then run it from the Actions tab.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-demo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build GitHub Pages demo bundle
        env:
          VITE_DEPLOYMENT: github-pages
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Optional isolated demo backend public variables (never production values)
          VITE_API_BASE: ${{ vars.DEMO_API_BASE }}
          VITE_FIREBASE_API_KEY: ${{ vars.DEMO_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.DEMO_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.DEMO_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.DEMO_FIREBASE_APP_ID }}
        run: pnpm run build:pages-demo

      - name: Verify bundle budget and absence of secrets/source maps
        run: |
          node scripts/bundle-budget.mjs
          pnpm run check:security

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
