name: Encrypted D1 Backup and Restore Verification

# Scheduled encrypted export of Cloudflare D1 with automated local restore verification.
# Backups are NEVER committed to Git and are NEVER served from public URLs.
# Artifacts are encrypted with AES-256 (PBKDF2 600k iterations) using BACKUP_ENCRYPTION_KEY.

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Database environment to back up"
        required: true
        default: production
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  backup:
    name: Export, Verify Restore & Encrypt (${{ inputs.environment || 'production' }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Export D1 database
        env:
          TARGET_ENV: ${{ inputs.environment || 'production' }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: d1 export DB --remote --env ${{ inputs.environment || 'production' }} --output ../../backup-raw.sql

      - name: Verify backup via scratch SQLite restore and integrity checks
        run: |
          set -euo pipefail
          test -s backup-raw.sql
          sqlite3 restore-check.db < backup-raw.sql
          INTEGRITY=$(sqlite3 restore-check.db "PRAGMA integrity_check;")
          test "$INTEGRITY" = "ok"
          FK=$(sqlite3 restore-check.db "PRAGMA foreign_key_check;")
          test -z "$FK"
          echo "Restore check passed. Table counts:"
          sqlite3 restore-check.db "SELECT 'users=' || count(*) FROM users; SELECT 'game_sessions=' || count(*) FROM game_sessions; SELECT 'admin_audit_logs=' || count(*) FROM admin_audit_logs;"
          rm -f restore-check.db

      - name: Compress, encrypt (AES-256-CBC + PBKDF2-SHA256) and checksum
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          TARGET_ENV: ${{ inputs.environment || 'production' }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_KEY"
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          OUT="croco-d1-${TARGET_ENV}-${STAMP}.sql.gz.enc"
          gzip -9 -c backup-raw.sql | openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 -salt -pass env:BACKUP_KEY -out "$OUT"
          sha256sum "$OUT" > "${OUT}.sha256"
          # Verify decryption round-trip matches original SQL checksum
          ORIG_HASH=$(sha256sum backup-raw.sql | awk '{print $1}')
          ROUND_HASH=$(openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 -pass env:BACKUP_KEY -in "$OUT" | gunzip -c | sha256sum | awk '{print $1}')
          test "$ORIG_HASH" = "$ROUND_HASH"
          rm -f backup-raw.sql
          mkdir -p backup-out
          mv "$OUT" "${OUT}.sha256" backup-out/

      - name: Upload encrypted backup artifact (private to repository maintainers)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: d1-backup-${{ inputs.environment || 'production' }}-${{ github.run_id }}
          path: backup-out/
          retention-days: 30
